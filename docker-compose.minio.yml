services:
  minio:
    # Pin a known-good RELEASE. Prefer latest stable from
    # https://hub.docker.com/r/minio/minio/tags — avoid "latest" in prod.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: selka-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - selka_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  selka_minio_data:
